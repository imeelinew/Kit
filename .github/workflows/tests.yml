name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Store deduplication
        run: ./scripts/test-clipboard-deduplication.sh
      - name: Paste transactions
        run: ./scripts/test-paste-transactions.sh
      - name: Pinned images
        run: ./scripts/test-pinned-images.sh
      # Builds the full app, so it runs last: fast failures above surface first.
      - name: Undo, list, and animation
        run: ./scripts/test-clipboard-list.sh
