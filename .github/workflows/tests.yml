name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app uses macOS 27 APIs (e.g. NSMenuItem.preferredImageVisibility) that only
    # exist in the Xcode 27 toolchain; the stock macos-latest image tops out at Xcode 26.6.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          swift -e 'import Metal; print("Metal device:", MTLCreateSystemDefaultDevice()?.name ?? "none")'
      - name: Store deduplication
        run: ./scripts/test-clipboard-deduplication.sh
      - name: Search pagination
        run: ./scripts/test-clipboard-search.sh
      - name: Capture pipeline
        run: ./scripts/test-capture.sh
      - name: Pinyin matching
        run: ./scripts/test-pinyin.sh
      - name: Paste transactions
        run: ./scripts/test-paste-transactions.sh
      - name: Pinned images
        run: ./scripts/test-pinned-images.sh
      # Builds the full app, so it runs last: fast failures above surface first.
      - name: Undo, list, animation, and previews
        run: ./scripts/test-clipboard-list.sh
